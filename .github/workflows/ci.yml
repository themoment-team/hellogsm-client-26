name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_IMAGE_URL: ${{ secrets.NEXT_PUBLIC_IMAGE_URL }}
      # 로그인 시작 경로는 client id가 비어 있으면 500을 응답한다. E2E는 제공자로 이동하지 않고
      # 302 응답과 인가 URL만 확인하므로 실제 값 대신 CI 전용 더미 값을 쓴다.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id
      NEXT_PUBLIC_KAKAO_REST_API_KEY: ci-kakao-rest-api-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Type Check
        run: pnpm check-types

      - name: Run Unit Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Smoke E2E
        run: pnpm test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Success Discord Notification
        uses: sarisia/actions-status-discord@v1.15.5
        if: success()
        with:
          webhook: ${{ secrets.WEBHOOK_URL }}
          title: '✅ CI 성공'
          status: success
          content: 'PR을 확인해주세요.'
          username: hellogsm-client bot
          color: 0x4CAF50

      - name: Failure Discord Notification
        uses: sarisia/actions-status-discord@v1.15.5
        if: failure()
        with:
          webhook: ${{ secrets.WEBHOOK_URL }}
          title: '❌ CI 실패'
          status: failure
          content: '에러를 확인해주세요.'
          username: hellogsm-client bot
          color: 0xe74c3c
